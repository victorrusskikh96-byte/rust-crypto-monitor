{
  "name": "CI",
  "on": { "push": {}, "pull_request": {} },
  "permissions": { "contents": "read" },
  "jobs": {
    "quality": {
      "name": "Rust quality gates",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": { "persist-credentials": false }
        },
        {
          "name": "Install pinned Rust toolchain",
          "run": "rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy"
        },
        { "name": "Formatting", "run": "cargo fmt --all -- --check" },
        { "name": "Clippy", "run": "cargo clippy --locked --all-targets --all-features -- -D warnings" },
        { "name": "Build", "run": "cargo build --locked --all-targets --all-features" },
        { "name": "Tests", "run": "cargo test --locked --all-features" }
      ]
    }
  }
}
